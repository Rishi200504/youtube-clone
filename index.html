    <title>Youtube</title>
    <style>
        .body {
            margin: 0%;
            border: 0%;
            scrollbar-width: none;
            font-family: 'Roboto Mono', monospace; 

        }

        .container {
            height: 100dvh;
            width: 100dvw;
            background-color: rgba(16, 16, 16);
        }

        .right {
            height: 15%;
            width: 85%;
            top: 0dvh;
            right: 0px;
            background-color: rgba(39, 39, 39);
            position: fixed;
        }

        .left {
            height: 100%;
            width: 15%;
            left: 0dvh;
            top: 0dvh;
            position: fixed;
            background-color: rgb(16, 3, 3);
            overflow: scroll;
            scrollbar-width: none;
        }

        .content {
            width: 85%;
            background-color: rgba(25, 26, 26, 0.888);
            position: fixed;
            left: 15%;
            height: 85%;
            top: 15%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            overflow: scroll;
        }

        .first {
            width: 100%;
            height: 50%;
            background-color: rgb(48, 33, 28);
        }

        .second {
            width: 100%;
            height: 50%;
            background-color: darkgray;
            scrollbar-width: none;
            display: flex;
            justify-content: start;
            align-items: center;
            overflow: scroll;
            flex: wrap;
            
        }

        .hello {
            background-color: rgba(30, 31, 31, 0.636);
            padding: 20px 20px;
            margin: 20px;
            border-radius: 10px;
            display: flex;
        }


        .video{
                width: 500px;
                height: 350px;
                margin: 80px 80px;
                background-color: rgb(184, 61, 61);
                border-radius: 15px;
                align-items: center;

            }
            .videos{
                width: 500px;
            }
            .high{
                width:15%;
                height:110px;
                background-color: rgb(78, 191, 61);
                position: fixed;
            }
            .one{
                display: flex;
                border-radius: 20px;
                background-color: rgb(22, 14, 5);
                margin: 10px 30px ;
                justify-content: space-evenly;
                cursor: pointer;

            }
            .para{
                font-size: 30px;
                color: white;
                cursor: pointer;
            }
            .para:hover{
                color: black;
                cursor: pointer;
                transition: 0.1s all ease;
            }
            .one:hover{
                transition: 0.1s all ease;
                background-color: azure;
                cursor: pointer;
                
            }
            .house{

                color: aliceblue;
            }
